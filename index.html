
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor de Produtos</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #ECEFF1;
      margin: 0;
      padding: 18px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0002;
    }

    h2 {
      text-align: center;
      color: #1565C0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 7px;
      font-size: 17px;
      color: white;
      cursor: pointer;
    }

    .abrir { background: #2E7D32; }
    .parar { background: #C62828; }
    .manual { background: #1976D2; }

    input {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      margin-top: 12px;
      border: 1px solid #bbb;
      border-radius: 7px;
    }

    #leitor {
      margin-top: 18px;
      width: 100%;
      overflow: hidden;
    }

    #leitor video {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
    }

    #mensagem {
      text-align: center;
      margin-top: 15px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .aviso {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<div class="container">
  <h2>📦 Leitor de Produtos</h2>

  <p class="aviso">
    Toque em BIPAR PRODUTO e enquadre todo o código de barras.
    A consulta será aberta após uma leitura válida.
  </p>

  <button class="abrir" onclick="abrirCamera()">
    📷 BIPAR PRODUTO
  </button>

  <button class="parar" onclick="pararCamera()">
    ⛔ PARAR CÂMERA
  </button>

  <div id="leitor"></div>

  <div id="mensagem" aria-live="polite">
    Câmera desligada.
  </div>

  <hr>

  <h3>Digitar código manualmente</h3>

  <input
    id="codigo"
    inputmode="numeric"
    autocomplete="off"
    placeholder="Digite o código de barras">

  <button class="manual" onclick="enviarCodigo()">
    🔍 CONSULTAR PRODUTO
  </button>
</div>

<script type="module">
  import {
    BrowserMultiFormatReader,
    BarcodeFormat,
    DecodeHintType
  } from "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/+esm";

  const URL_CONSULTA =
    "https://script.google.com/macros/s/AKfycbwwmIhIBgcwh8LKXpjQCyvCGcgSNz2mkgbdLScCfJpHRSNRxItEfL_tnLguKgtExNDxtw/exec";

  const mensagemEl = document.getElementById("mensagem");
  const codigoEl = document.getElementById("codigo");

  let leitor = null;
  let controles = null;
  let processando = false;
  let cameraAtiva = false;

  function mensagem(texto) {
    mensagemEl.textContent = texto;
  }

  function ean13Valido(codigo) {
    if (!/^\d{13}$/.test(codigo)) return false;

    let soma = 0;

    for (let i = 0; i < 12; i++) {
      soma += Number(codigo[i]) * (i % 2 === 0 ? 1 : 3);
    }

    return ((10 - soma % 10) % 10) === Number(codigo[12]);
  }

  async function carregarLeitor() {
    if (leitor) return leitor;

    const hints = new Map();

    hints.set(DecodeHintType.POSSIBLE_FORMATS, [
      BarcodeFormat.EAN_13,
      BarcodeFormat.EAN_8,
      BarcodeFormat.UPC_A,
      BarcodeFormat.UPC_E,
      BarcodeFormat.CODE_128,
      BarcodeFormat.CODE_39
    ]);

    leitor = new BrowserMultiFormatReader(hints, 250);
    return leitor;
  }

  window.abrirCamera = async function() {
    if (cameraAtiva || processando) return;

    try {
      mensagem("Preparando leitor de código de barras...");

      await carregarLeitor();

      cameraAtiva = true;

      controles = await leitor.decodeFromConstraints(
        {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        "leitor",
        (resultado, erro, control) => {
          if (!resultado || processando) return;

          const codigo = String(resultado.getText()).trim();
          const formato = resultado.getBarcodeFormat();

          // Para EAN-13, exige 13 dígitos e verificador correto.
          if (formato === BarcodeFormat.EAN_13) {
            if (!ean13Valido(codigo)) {
              mensagem(
                "Leitura incompleta ou inválida. Enquadre todo o código e tente novamente."
              );
              return;
            }
          }

          // Não aceitar como EAN-13 uma leitura numérica
          // de apenas 12 dígitos.
          if (/^\d{12}$/.test(codigo)) {
            mensagem(
              "Foram lidos apenas 12 dígitos. Ajuste a câmera e tente novamente."
            );
            return;
          }

          processando = true;
          codigoEl.value = codigo;

          mensagem("Código lido: " + codigo + ". Abrindo consulta...");

          pararCamera().finally(() => {
            window.location.href =
              URL_CONSULTA + "?codigo=" + encodeURIComponent(codigo);
          });
        }
      );

      mensagem("Câmera ativa. Enquadre todo o código de barras.");

    } catch (erro) {
      cameraAtiva = false;

      mensagem(
        "Não foi possível abrir a câmera. Verifique a permissão e tente novamente. " +
        (erro.message || "")
      );
    }
  };

  window.pararCamera = async function() {
    cameraAtiva = false;

    try {
      if (controles) {
        controles.stop();
        controles = null;
      }

      if (leitor) {
        leitor.reset();
      }

      mensagem("Câmera desligada.");
    } catch (erro) {
      console.log(erro);
    }
  };

  window.enviarCodigo = function() {
    const codigo = codigoEl.value.trim();

    if (!codigo) {
      mensagem("Digite um código de barras.");
      return;
    }

    window.location.href =
      URL_CONSULTA + "?codigo=" + encodeURIComponent(codigo);
  };
</script>
</body>
</html>
